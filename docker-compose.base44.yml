services:
  web:
    # This repo is a single saved HTML snapshot of a Base44 app. Its inline
    # analytics/tracking scripts stall the preview iframe, so at startup we
    # strip every <script> tag (keeping the rendered HTML/CSS) and serve the
    # cleaned page. python:3.12-slim is a plain runtime base image.
    image: python:3.12-slim
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/repo:ro
    command:
      - sh
      - -c
      - >
        python3 -c 'import re,os; h=open("/repo/The VJ Pulse _ Base44.html",encoding="utf-8").read(); h=re.sub(r"<script.*?</script>","",h,flags=re.S); os.makedirs("/srv",exist_ok=True); open("/srv/index.html","w",encoding="utf-8").write(h)' &&
        cd /srv && exec python3 -m http.server 3000 --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
