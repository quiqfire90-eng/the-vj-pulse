services:
  web:
    # This repo is a single saved HTML snapshot of a Base44 app. serve.py strips
    # the inline analytics/tracking <script> tags (which stall the preview iframe)
    # and serves the cleaned rendered HTML/CSS on port 3000. python:3.12-slim is
    # a plain runtime base image.
    image: python:3.12-slim
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/repo:ro
    command: ["python3", "/repo/serve.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
